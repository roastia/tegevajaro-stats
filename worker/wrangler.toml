# テゲスタ！ おすすめスポットの投稿受付
name = "tegesta-spots"
main = "src/index.js"
compatibility_date = "2026-10-01"

# 公開の入口は https://tegesta-spots.tegestats.workers.dev の1つだけ（版ごとのプレビューURLは作らない）
workers_dev = true
preview_urls = false

# 受け付けるサイト（カンマ区切り）。手元で試すときは http://localhost:4321 を足す
[vars]
ALLOWED_ORIGIN = "https://tegestats.com"
# 同じ回線（IP）からの1日の投稿数の上限。スタジアムの Wi-Fi など、みんなで同じ回線を使う場所を考えて10件
IP_DAILY_LIMIT = "10"

# `npx wrangler d1 create tegesta-spots` で出た database_id をここに貼る
[[d1_databases]]
binding = "DB"
database_name = "tegesta-spots"
database_id = "bff5c145-bc90-473e-9d54-f088e0be0149"

# 毎日 4:10（UTC）に古い制限記録を消す
[triggers]
crons = ["10 4 * * *"]

# 秘密の値は wrangler.toml に書かず、次のコマンドで登録する：
#   npx wrangler secret put TURNSTILE_SECRET   （Turnstile のシークレットキー）
#   npx wrangler secret put IP_HASH_SECRET     （長いランダムな文字列。openssl rand -hex 32 などで作る）

# ---- テスト用（npx wrangler@4.150.0 deploy --env test）。手順は docs/test-site.md ----
# 名前はどれも test- で始める：Worker は test-tegesta-api、データベースは test-tegesta-db（本番の tegesta-spots とは別）
[env.test]
name = "test-tegesta-api"
workers_dev = true
preview_urls = false

[env.test.vars]
ALLOWED_ORIGIN = "https://test-tegesta.pages.dev,http://localhost:4321"
IP_DAILY_LIMIT = "100"
TEST_MODE = "1"

[[env.test.d1_databases]]
binding = "DB"
database_name = "test-tegesta-db"
# `npx wrangler@4.150.0 d1 create test-tegesta-db` で出た database_id をここに貼る
database_id = "ここに貼る"

[env.test.triggers]
crons = ["10 4 * * *"]
