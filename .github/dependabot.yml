# 部品の更新を GitHub が知らせる（プルリクエストを作る。取り込むかどうかは人が決める）
# cooldown：出て14日たっていない版は提案しない（「出て2週間以内の版は避ける」のルール）
# 脆弱性の修正（セキュリティアップデート）は cooldown に関係なくすぐ届く
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    cooldown: { default-days: 14 }
    versioning-strategy: increase
    groups:
      all: { patterns: ['*'] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    cooldown: { default-days: 14 }
    groups:
      actions: { patterns: ['*'] }
